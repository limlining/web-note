<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>LAB SECP</title>
    <style>
        body {
            background-image: url('https://i.pinimg.com/736x/5b/26/9c/5b269c270d9ee2283e7cd4008d2c5cac.jpg');
      background-size: cover;
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: #4169E1;
      font-family: Arial, Helvetica, sans-serif;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
        }
        
        .container {
            max-width: 500px;
            margin: 60px auto;
            padding: 40px 30px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        
        h1 {
            color: #333;
            margin-bottom: 40px;
            font-size: 2.2em;
            font-weight: 600;
            position: relative;
            padding-bottom: 15px;
        }
        
        h1::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 4px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 2px;
        }
        
        .lab-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 40px;
        }
        
        .lab-btn {
            background: white;
            color: #333;
            padding: 16px 30px;
            font-size: 16px;
            border-radius: 12px;
            cursor: pointer;
            border: none;
            font-weight: 500;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            text-align: left;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .lab-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.2);
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .lab-btn span {
            font-size: 18px;
            opacity: 0.8;
        }
        
        .back-btn {
            background: #333;
            color: white;
            padding: 14px 40px;
            font-size: 16px;
            border-radius: 12px;
            cursor: pointer;
            border: none;
            font-weight: 500;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .back-btn:hover {
            background: #667eea;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
        }
        
        .lab-btn:nth-child(1)::before {
            content: "1️⃣ ";
            margin-right: 10px;
        }
        
        .lab-btn:nth-child(2)::before {
            content: "2️⃣ ";
            margin-right: 10px;
        }
        
        .lab-btn:nth-child(3)::before {
            content: "3️⃣ ";
            margin-right: 10px;
        }
        
        .lab-btn:nth-child(4)::before {
            content: "4️⃣ ";
            margin-right: 10px;
        }
        
        .lab-btn:nth-child(5)::before {
            content: "5️⃣ ";
            margin-right: 10px;
        }
        
        .lab-btn:nth-child(6)::before {
            content: "6️⃣ ";
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>LABORATORY</h1>
        
        <div class="lab-list">
            <button class="lab-btn" onclick="window.open('https://drive.google.com/file/d/11eYxIWPjRiAvEFkF6cXQR8jW_XGtoUJn/view?usp=sharing', '_blank')">
                LAB 1
                <span>📖</span>
            </button>
            
            <button class="lab-btn" onclick="window.open('https://docs.google.com/document/d/1WmEYQrjEGIgQaS3qCmxAgX-k_jjeo4oi/edit?usp=sharing&ouid=113621682268515561495&rtpof=true&sd=true', '_blank')">
                LAB 2
                <span>📖</span>
            </button>
            
            <button class="lab-btn" onclick="window.open('https://drive.google.com/file/d/1hxP6-Uju1CFpLvUlMAr85HsNxhIAwTx3/view?usp=sharing', '_blank')">
                LAB 3
                <span>📖</span>
            </button>
            
           
        </div>
        
        <button class="back-btn" onclick="window.location.href='SECR.html'">
            ← Back to SECR
        </button>
    </div>
</body>
</html>
